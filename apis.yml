name: X1
description: >-
  X1 was a San Francisco fintech behind the X1 Card, a smart Visa credit card that set limits based on
  income rather than credit score, backed by Craft Ventures. Robinhood acquired X1 in 2023 and folded the
  product into what is now the Robinhood Gold Card; x1creditcard.com and api.x1creditcard.com redirect to
  robinhood.com (probed 2026-07-21). X1 never published a public developer API, ships no SDK packages, and
  has no GitHub organization, so this profile records the acquisition and the domain-security posture of
  the remaining domain and points to the Robinhood profile in the API Evangelist network.
